<div class="targeta" tabindex="0" role="article" aria-label="Missió">
  
  <div class="header">
    <h3>{{ element.titol | uppercase }}</h3>
  </div>

  <div class="body">
    <p>{{ element.descripcio }}</p>
  </div>
  
  <div class="footer">
    <span class="recompensa">
      {{ element.preu }}
    </span>

    <span *ngIf="element.esPopular" class="popular">
      Popular
    </span>
  </div>

</div>
