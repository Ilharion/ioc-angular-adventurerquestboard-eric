<h2>Login</h2>

<form (ngSubmit)="login()">

  <input [(ngModel)]="email" name="email" placeholder="Email">
  <input [(ngModel)]="password" name="password" type="password" placeholder="Contrasenya">

  <button type="submit">Entrar</button>

</form>

<p *ngIf="error" style="color:red;">
  Credencials incorrectes
</p>
